<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyPath - Profile Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed-variant": "#005236",
                    "on-surface": "#191c1e",
                    "surface-container-low": "#f2f4f6",
                    "tertiary-container": "#007d55",
                    "inverse-on-surface": "#eff1f3",
                    "on-secondary-fixed-variant": "#3f465c",
                    "surface-container": "#eceef0",

                    "surface-variant": "#e0e3e5",
                    "outline": "#737686",
                    "inverse-primary": "#b4c5ff",
                    "surface-container-high": "#e6e8ea",
                    "on-primary-fixed-variant": "#003ea8",
                    "background": "#f7f9fb",
                    "surface": "#f7f9fb",
                    "tertiary-fixed": "#6ffbbe",
                    "surface-tint": "#0053db",
                    "on-tertiary-container": "#bdffdb",
                    "on-surface-variant": "#434655",
                    "on-secondary-fixed": "#131b2e",
                    "on-background": "#191c1e",
                    "on-secondary-container": "#5c647a",
                    "primary": "#004ac6",
                    "secondary-fixed-dim": "#bec6e0",
                    "tertiary-fixed-dim": "#4edea3",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#002113",
                    "on-secondary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "secondary": "#565e74",
                    "secondary-container": "#dae2fd",
                    "primary-container": "#2563eb",
                    "surface-container-highest": "#e0e3e5",
                    "on-primary-container": "#eeefff",
                    "primary-fixed-dim": "#b4c5ff",
                    "surface-bright": "#f7f9fb",
                    "tertiary": "#006242",
                    "error": "#ba1a1a",
                    "surface-dim": "#d8dadc",
                    "primary-fixed": "#dbe1ff",
                    "on-primary": "#ffffff",
                    "on-primary-fixed": "#00174b",
                    "outline-variant": "#c3c6d7",
                    "error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "margin-desktop": "40px",
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "stack-lg": "32px",
                    "container-max": "1280px",
                    "stack-md": "16px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "label-sm": [
                            "Inter"
                    ],
                    "body-sm": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Inter"
                    ],
                    "display": [
                            "Inter"
                    ],
                    "headline-lg": [
                            "Inter"
                    ],
                    "headline-lg-mobile": [
                            "Inter"
                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "label-md": [
                            "Inter"
                    ],
                    "body-md": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "label-sm": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "fontWeight": "500"
                            }
                    ],
                    "body-sm": [
                            "14px",

                    ],
                    "display": [
                            "36px",

                                    "lineHeight": "44px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "28px",
                            {
                                    "lineHeight": "36px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-lg-mobile": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "600"
                            }
                    ],
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "400"
                            }
                    ],
                    "label-md": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "600"

                    ],
                    "body-md": [
                            "16px",

                                    "lineHeight": "24px",
                                    "fontWeight": "400"

          },
        }
      }

</head>
<body class="h-full bg-background text-on-background antialiased flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed">StudyPath</span>
</div>
<div class="flex items-center gap-4">
<!-- Progress indicator replacing standard trailing icon for onboarding -->
<span class="text-label-md font-label-md text-on-surface-variant dark:text-surface-variant">Step 1 of 5</span>
<span class="material-symbols-outlined text-on-surface-variant dark:text-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors rounded-full p-2 cursor-pointer">close</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Abstract Background Shapes for Modern Feel -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 hidden md:block">
<div class="absolute top-10 left-10 w-64 h-64 bg-primary-container rounded-full blur-3xl mix-blend-multiply"></div>
<div class="absolute bottom-10 right-10 w-96 h-96 bg-secondary-container rounded-full blur-3xl mix-blend-multiply"></div>
</div>
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl border border-outline-variant p-stack-lg md:p-margin-desktop relative z-10 shadow-sm">
<div class="mb-stack-lg text-center">
<h1 class="text-display font-display text-on-surface mb-stack-sm">Education Level</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Build your profile to see relevant scholarship matches.</p>
</div>
<!-- Progress Bar -->
<div class="w-full bg-surface-container-high rounded-full h-2 mb-stack-lg">
<div class="bg-primary h-2 rounded-full" style="width: 20%"></div>
</div>
<!-- Form/Selection Area -->
<form action="#" class="space-y-stack-md" method="POST">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-md">
<!-- Option 1 -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-stack-md hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="education_level" type="radio" value="10th"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">menu_book</span>
</div>
<div>
<h3 class="text-headline-md font-headline-md text-on-surface">10th Grade</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">High School</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-lg border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
<!-- Option 2 -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-stack-md hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="education_level" type="radio" value="12th"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">workspace_premium</span>
</div>
<div>
<h3 class="text-headline-md font-headline-md text-on-surface">12th Grade</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Higher Secondary</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-lg border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
<!-- Option 3 -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-stack-md hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="education_level" type="radio" value="bachelors"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">school</span>
</div>
<div>
<h3 class="text-headline-md font-headline-md text-on-surface">Bachelor's</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Undergraduate Degree</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-lg border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
<!-- Option 4 -->
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-stack-md hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="education_level" type="radio" value="masters"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">local_library</span>
</div>
<div>
<h3 class="text-headline-md font-headline-md text-on-surface">Master's</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Postgraduate Degree</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-lg border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
</div>
<div class="pt-stack-lg flex justify-end">
<button class="bg-primary-container text-on-primary-container text-label-md font-label-md px-6 py-3 rounded-lg flex items-center gap-2 hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container" type="button">
                        Next
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Suppressed BottomNavBar and SideNav as per Linear/Transactional rules -->
</body></html>
