<!DOCTYPE html>

<html class="h-full dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyPath - Profile Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "surface-container-highest": "#363636",
                    "on-secondary-container": "#e3e3e3",
                    "on-surface": "#e2e2e2",

                    "on-background": "#e2e2e2",
                    "on-secondary": "#131313",
                    "tertiary-container": "#005227",
                    "on-error": "#690005",
                    "surface-variant": "#444444",
                    "on-error-container": "#ffdad6",
                    "primary-fixed-dim": "#00e676",
                    "on-tertiary": "#131313",
                    "secondary-fixed-dim": "#a1a1a1",
                    "outline": "#8f8f8f",

                    "surface-tint": "#00e676",

            },
            "borderRadius": {

                    "lg": "1.5rem",
                    "xl": "1.5rem",
                    "full": "9999px"

            "spacing": {

                    "margin-desktop": "40px",
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "stack-lg": "32px",
                    "container-max": "1280px",
                    "stack-md": "16px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "label-sm": [
                            "Inter"
                    ],
                    "body-sm": [
                            "Inter"
                    ],
                    "headline-md": [

                    ],
                    "display": [

                    ],
                    "headline-lg": [

                    ],
                    "headline-lg-mobile": [

                    "body-lg": [

                    "label-md": [

                    "body-md": [

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="h-full bg-background text-on-background antialiased flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="text-headline-md font-headline-md font-bold text-primary">StudyPath</span>
</div>
<div class="flex items-center gap-4">
<!-- Progress indicator replacing standard trailing icon for onboarding -->
<span class="text-label-md font-label-md text-on-surface-variant">Step 1 of 5</span>
<span class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full p-2 cursor-pointer">close</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Abstract Background Shapes for Modern Feel -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-10 hidden md:block">
<div class="absolute top-10 left-10 w-64 h-64 bg-primary-container rounded-full blur-3xl mix-blend-multiply"></div>
<div class="absolute bottom-10 right-10 w-96 h-96 bg-secondary-container rounded-full blur-3xl mix-blend-multiply"></div>
</div>
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-[24px] border border-outline-variant p-stack-lg md:p-margin-desktop relative z-10 shadow-sm">
<div class="mb-stack-lg text-center">
<h1 class="text-display font-display text-on-surface mb-stack-sm">Education Level</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Build your profile to see relevant scholarship matches.</p>
</div>
<!-- Progress Bar -->
<div class="w-full bg-surface-container-high rounded-full h-2 mb-stack-lg">
<div class="bg-primary h-2 rounded-full" style="width: 20%"></div>
</div>
<!-- Form/Selection Area -->
<form action="#" class="space-y-stack-md" method="POST">
<div class="grid grid-cols-1 sm:grid-cols-2 gap-stack-md">
<!-- Option 1 -->
<label class="relative flex cursor-pointer rounded-[24px] border border-outline-variant bg-surface-container-lowest p-stack-md hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="education_level" type="radio" value="10th"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">menu_book</span>
</div>
<div>
<h3 class="text-headline-md font-headline-md text-on-surface">10th Grade</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">High School</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-[#00210f] text-[16px] opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-[24px] border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
<!-- Option 2 -->
<label class="relative flex cursor-pointer rounded-[24px] border border-outline-variant bg-surface-container-lowest p-stack-md hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="education_level" type="radio" value="12th"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">workspace_premium</span>
</div>
<div>
<h3 class="text-headline-md font-headline-md text-on-surface">12th Grade</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Higher Secondary</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-[#00210f] text-[16px] opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-[24px] border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
<!-- Option 3 -->
<label class="relative flex cursor-pointer rounded-[24px] border border-outline-variant bg-surface-container-lowest p-stack-md hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="education_level" type="radio" value="bachelors"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">school</span>
</div>
<div>
<h3 class="text-headline-md font-headline-md text-on-surface">Bachelor's</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Undergraduate Degree</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-[#00210f] text-[16px] opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-[24px] border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
<!-- Option 4 -->
<label class="relative flex cursor-pointer rounded-[24px] border border-outline-variant bg-surface-container-lowest p-stack-md hover:bg-surface-container-low transition-colors group">
<input class="peer sr-only" name="education_level" type="radio" value="masters"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-stack-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container peer-checked:bg-primary-container peer-checked:text-on-primary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">local_library</span>
</div>
<div>
<h3 class="text-headline-md font-headline-md text-on-surface">Master's</h3>
<p class="text-body-sm font-body-sm text-on-surface-variant">Postgraduate Degree</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-[#00210f] text-[16px] opacity-0 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<div class="absolute inset-0 rounded-[24px] border-2 border-transparent peer-checked:border-primary pointer-events-none transition-colors"></div>
</label>
</div>
<div class="pt-stack-lg flex justify-end">
<button class="bg-primary text-on-primary-container text-label-md font-label-md px-6 py-3 rounded-full flex items-center gap-2 hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background" type="button">
                        Next
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Suppressed BottomNavBar and SideNav as per Linear/Transactional rules -->
</body></html>
